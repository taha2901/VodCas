<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d10000">
<title>ادفع بفودافون كاش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60000; --red-dark: #a80000; --ink: #15151a; --muted: #80808b;
    --line: #f0f0f4; --bg: #f4f4f7; --green: #1faa59; --purple: #5b2fa8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
  }
  button { font-family: inherit; }
  svg { width: 18px; height: 18px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff;
    padding: 22px 20px 64px; border-radius: 0 0 30px 30px;
    background: radial-gradient(120% 140% at 100% 0%, #ff3a3a 0%, var(--red) 45%, var(--red-dark) 100%);
  }
  .hero::after {
    content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
    left: -70px; top: -90px; background: rgba(255,255,255,.07);
  }
  .hero-inner { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
  }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: #5ef08f; }
  .hero h1 { margin: 12px 0 2px; font-size: 26px; font-weight: 800; line-height: 1.3; }
  .hero p { margin: 0; font-size: 14px; opacity: .85; font-weight: 600; }

  .wrap { max-width: 440px; margin: 0 auto; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }

  /* ---------- Amount ---------- */
  .amount {
    position: relative; z-index: 2; margin-top: -40px;
    display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px;
    padding: 6px 18px; border: 2px solid transparent;
    box-shadow: 0 14px 34px -16px rgba(120,0,0,.35); transition: border-color .2s;
  }
  .amount:focus-within { border-color: var(--red); }
  .amount label { font-weight: 800; font-size: 15px; white-space: nowrap; }
  .amount input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 10px 0;
    font: 800 26px "Cairo", sans-serif; color: var(--ink); text-align: center; direction: ltr;
  }
  .amount input::placeholder { color: #d0d0d8; }
  .amount span { color: var(--muted); font-weight: 700; font-size: 14px; }

  .section { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 10px; }
  .section h2 { margin: 0; font-size: 15px; font-weight: 800; }
  .section small { font-size: 12px; color: var(--muted); font-weight: 700; }

  /* ---------- Groups ---------- */
  .group { background: #fff; border-radius: 20px; margin-bottom: 10px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 4px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: #fff0f0; color: var(--red); font-weight: 800; font-size: 15px;
  }
  .group-head b { font-size: 15px; }
  .group-head span { margin-inline-start: auto; font-size: 11.5px; color: var(--muted); font-weight: 700; }

  .row {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none;
    padding: 9px 14px; cursor: pointer; text-align: right; transition: background .15s;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:active { background: #fff6f6; }
  .row .phone {
    flex: 1; direction: ltr; text-align: right; font-size: 17px; font-weight: 800;
    letter-spacing: .5px; color: var(--ink);
  }
  .row .go {
    display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 13.5px; font-weight: 700;
  }
  .row .go svg { width: 14px; height: 14px; }

  /* ---------- InstaPay ---------- */
  .insta {
    margin-top: 12px; border-radius: 20px; padding: 14px; color: #fff;
    background: linear-gradient(135deg, #7a45d6, var(--purple) 60%, #3d1d78);
  }
  .insta-top { display: flex; align-items: center; gap: 10px; }
  .insta-logo { padding: 4px 10px; border-radius: 9px; background: rgba(255,255,255,.18); font-weight: 800; font-size: 13px; direction: ltr; }
  .insta-top .who { font-size: 13px; opacity: .85; font-weight: 600; }
  .insta .phone { direction: ltr; text-align: right; font-size: 20px; font-weight: 800; letter-spacing: .5px; margin: 6px 2px 10px; }
  .insta-actions { display: flex; gap: 8px; }
  .insta-actions a, .insta-actions button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 42px; border: 0; border-radius: 12px; cursor: pointer; text-decoration: none;
    font-size: 14px; font-weight: 700;
  }
  .insta-open { background: #fff; color: var(--purple); }
  .insta-copy { background: rgba(255,255,255,.16); color: #fff; }
  .insta-copy.done { background: #fff; color: var(--green); }

  /* ---------- WhatsApp ---------- */
  .wa {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px;
    padding: 13px; border-radius: 16px; text-decoration: none;
    background: #e8f8ef; color: var(--green); font-weight: 700; font-size: 14.5px;
  }

  /* ---------- Developer credit (fixed bottom) ---------- */
  .dev-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    padding: 14px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, rgba(244,244,247,0));
  }
  .dev {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    padding: 6px 6px 6px 16px; border-radius: 999px; background: #fff;
    border: 1px solid #ebebf0; box-shadow: 0 6px 20px -10px rgba(20,20,40,.3);
    transition: transform .15s;
  }
  .dev:active { transform: scale(.96); }
  .dev-icon {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--green); color: #fff; flex-shrink: 0;
  }
  .dev-icon svg { width: 17px; height: 17px; }
  .dev-text { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .dev-text b { color: var(--ink); font-weight: 800; }
  .dev-text i { display: inline-block; width: 1px; height: 12px; background: #dcdce3; margin: 0 8px; vertical-align: middle; }
  .dev-text em { font-style: normal; color: var(--green); font-weight: 800; }

  .toast {
    position: fixed; bottom: calc(84px + env(safe-area-inset-bottom)); left: 50%;
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none; z-index: 10;
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-weight: 600; font-size: 14px; transition: all .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <span class="chip"><i></i>Vodafone Cash</span>
    <h1 id="shopName"></h1>
    <p>اكتب المبلغ ودوس على أي رقم</p>
  </div>
</header>

<div class="wrap">
  <div class="amount">
    <label for="amount">المبلغ</label>
    <input id="amount" type="number" inputmode="numeric" min="1" placeholder="0">
    <span>جنيه</span>
  </div>

  <div class="section">
    <h2>أرقام فودافون كاش</h2>
    <small id="hint">بيفتح التحويل علطول</small>
  </div>
  <div id="groups"></div>

  <div id="extras"></div>
</div>

<div class="dev-bar">
  <a class="dev" id="credit" target="_blank" rel="noopener">
    <span class="dev-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg></span>
    <span class="dev-text">تصميم وتنفيذ <b id="devName"></b><i></i><em id="devPhone" dir="ltr"></em></span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>',
  };

  // الآيفون بيمنع أكواد * و # من اللينكات، فبننسخ الرقم بداله
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const amountInput = document.getElementById("amount");
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.replace(/(\d{3})(\d{4})(\d{4})/, "$1 $2 $3");

  // ---- Header ----
  $("shopName").textContent = SHOP.name;
  document.title = SHOP.name + " | فودافون كاش";
  if (isIOS) $("hint").textContent = "دوس على الرقم وهيتنسخ";

  // ---- Numbers (متجمعة حسب الاسم) ----
  const groups = new Map();
  SHOP.numbers.forEach(({ number, name }) => {
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(number);
  });

  const container = $("groups");
  groups.forEach((numbers, name) => {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<div class="group-head"><div class="avatar"></div><b></b><span></span></div>`;
    g.querySelector(".avatar").textContent = name.trim().charAt(0);
    g.querySelector("b").textContent = name;
    g.querySelector("span").textContent = numbers.length > 1 ? `${numbers.length} أرقام` : "";
    numbers.forEach((number) => {
      const row = document.createElement("button");
      row.className = "row";
      row.innerHTML = `<span class="phone"></span><span class="go">${isIOS ? ICONS.copy + "نسخ" : "حوّل" + ICONS.arrow}</span>`;
      row.querySelector(".phone").textContent = fmt(number);
      row.onclick = () => transfer(number);
      g.appendChild(row);
    });
    container.appendChild(g);
  });

  // ---- InstaPay / WhatsApp ----
  const extras = $("extras");
  if (SHOP.instapay) {
    const box = document.createElement("div");
    box.className = "insta";
    box.innerHTML = `
      <div class="insta-top"><span class="insta-logo">InstaPay</span><span class="who"></span></div>
      <div class="phone"></div>
      <div class="insta-actions">
        ${SHOP.instapay.link ? `<a class="insta-open" target="_blank" rel="noopener">${ICONS.open}ادفع بإنستاباي</a>` : ""}
        <button class="insta-copy">${ICONS.copy}<span>نسخ الرقم</span></button>
      </div>`;
    box.querySelector(".who").textContent = SHOP.instapay.name;
    box.querySelector(".phone").textContent = fmt(SHOP.instapay.number);
    const open = box.querySelector(".insta-open");
    if (open) open.href = SHOP.instapay.link;
    const btn = box.querySelector(".insta-copy");
    btn.onclick = () => copy(SHOP.instapay.number, btn);
    extras.appendChild(box);
  }
  if (SHOP.whatsapp) {
    const wa = document.createElement("a");
    wa.className = "wa";
    wa.target = "_blank";
    wa.rel = "noopener";
    wa.href = `https://wa.me/${SHOP.whatsapp}?text=` + encodeURIComponent("تم التحويل فودافون كاش");
    wa.innerHTML = `${ICONS.check}<span>حوّلت؟ ابعت صورة التحويل</span>`;
    wa.onclick = () => {
      const amount = amountInput.value ? ` بمبلغ ${amountInput.value} جنيه` : "";
      wa.href = `https://wa.me/${SHOP.whatsapp}?text=` + encodeURIComponent(`تم التحويل فودافون كاش${amount}`);
    };
    extras.appendChild(wa);
  }

  // ---- Credit ----
  $("devName").textContent = DEV.name;
  $("devPhone").textContent = DEV.phone;
  $("credit").href = "https://wa.me/2" + DEV.phone;

  // ---- Actions ----
  // يفتح الاتصال بكود تحويل فودافون كاش: *9*7*الرقم*المبلغ#  (# بتتكتب %23)
  // لو المبلغ فاضي، الكود بيتكتب لحد الرقم والزبون يكمّل المبلغ و # بنفسه
  function transfer(number) {
    if (isIOS) {
      copy(number, null, "اتنسخ الرقم، حوّل من تطبيق Ana Vodafone");
      return;
    }
    const amount = amountInput.value.trim();
    if (amount && Number(amount) > 0) {
      location.href = `tel:*9*7*${number}*${amount}%23`;
    } else {
      toast("اكتب المبلغ وبعده # ودوس اتصال");
      location.href = `tel:*9*7*${number}*`;
    }
  }

  function copy(text, btn, msg = "تم نسخ الرقم") {
    const done = () => {
      toast(msg);
      if (!btn) return;
      const old = btn.innerHTML;
      btn.classList.add("done");
      btn.innerHTML = `${ICONS.check}<span>اتنسخ</span>`;
      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = old; }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    ta.remove();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  // ---- Offline ----
  // بعد أول زيارة الصفحة بتتحفظ على الموبايل وتفتح بعد كده من غير نت
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
