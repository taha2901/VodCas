<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60000">
<title>ادفع بفودافون كاش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60000; --red-dark: #b00000; --ink: #17171c; --muted: #7a7a85;
    --line: #ededf2; --bg: #f5f5f8; --green: #1faa59;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
  }
  .app {
    max-width: 440px; min-height: 100%; margin: 0 auto;
    display: flex; flex-direction: column; padding: 0 16px;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; gap: 12px; padding: 18px 2px 4px; }
  .logo {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px;
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px;
    background: linear-gradient(135deg, #ff3b3b, var(--red-dark));
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.3; }
  header p { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }

  /* ---------- Amount ---------- */
  .amount {
    display: flex; align-items: center; gap: 10px; background: #fff; margin-top: 14px;
    border: 2px solid var(--line); border-radius: 18px; padding: 4px 16px; transition: border-color .2s;
  }
  .amount:focus-within { border-color: var(--red); }
  .amount label { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .amount input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0;
    font: 800 24px "Cairo", sans-serif; color: var(--ink); text-align: center; direction: ltr;
  }
  .amount input::placeholder { color: #c9c9d1; }
  .amount span { color: var(--muted); font-weight: 700; font-size: 14px; }

  /* ---------- Numbers ---------- */
  .label { font-size: 13px; color: var(--muted); font-weight: 700; margin: 18px 4px 8px; }
  .list { background: #fff; border-radius: 18px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .avatar {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
    display: grid; place-items: center; font-weight: 800; font-size: 17px;
    background: #fff0f0; color: var(--red);
  }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .phone { direction: ltr; text-align: right; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
  .icon-btn {
    width: 42px; height: 42px; flex-shrink: 0; border: 0; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; background: #f2f2f6; color: var(--ink); transition: all .15s;
  }
  .icon-btn.done { background: #e8f8ef; color: var(--green); }
  .pay {
    height: 42px; padding: 0 16px; flex-shrink: 0; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--red); color: #fff; font: 700 15px "Cairo", sans-serif;
  }
  .icon-btn:active, .pay:active, .wa:active { transform: scale(.95); }
  svg { width: 20px; height: 20px; }

  .hint { font-size: 13px; color: var(--muted); margin: 10px 4px 0; line-height: 1.7; }
  .hint b { color: var(--red); }

  /* ---------- WhatsApp ---------- */
  .wa {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px;
    padding: 13px; border-radius: 16px; text-decoration: none;
    background: #e8f8ef; color: var(--green); font-weight: 700; font-size: 15px;
  }
  .insta { background: #f0ebfa; color: #4b2a85; margin-top: 8px; }

  /* ---------- Developer credit (fixed bottom) ---------- */
  .shop { flex: 1; min-width: 0; }
  .app { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .dev-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, rgba(245,245,248,0));
  }
  .dev {
    display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
    padding: 7px 7px 7px 16px; border-radius: 999px; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 6px 20px -10px rgba(20,20,40,.3);
    transition: transform .15s;
  }
  .dev:active { transform: scale(.96); }
  .dev-icon {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    background: var(--green); color: #fff; flex-shrink: 0;
  }
  .dev-icon svg { width: 18px; height: 18px; }
  .dev-text { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .dev-text b { color: var(--ink); font-weight: 800; }
  .dev-text i { display: inline-block; width: 1px; height: 12px; background: #dcdce3; margin: 0 8px; vertical-align: middle; }
  .dev-text em { font-style: normal; color: var(--green); font-weight: 800; }

  .toast {
    position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 50%;
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-weight: 600; font-size: 14px; transition: all .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo" id="logo"></div>
    <div class="shop">
      <h1 id="shopName"></h1>
      <p>ادفع بفودافون كاش</p>
    </div>
  </header>

  <div class="amount">
    <label for="amount">المبلغ</label>
    <input id="amount" type="number" inputmode="numeric" min="1" placeholder="0">
    <span>جنيه</span>
  </div>

  <div class="label">اختار الرقم</div>
  <div class="list" id="numbers"></div>
  <div class="hint">دوس <b>حوّل</b> ← هيفتح الاتصال والكود جاهز ← دوس اتصال واكتب الرقم السري</div>

  <div id="extras"></div>
</div>

<div class="dev-bar">
  <a class="dev" id="credit" target="_blank" rel="noopener">
    <span class="dev-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg></span>
    <span class="dev-text">تصميم وتنفيذ <b id="devName"></b><i></i><em id="devPhone" dir="ltr"></em></span>
  </a>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  };

  const amountInput = document.getElementById("amount");
  const $ = (id) => document.getElementById(id);

  // ---- Header ----
  $("shopName").textContent = SHOP.name;
  $("logo").textContent = SHOP.name.trim().charAt(0);
  document.title = SHOP.name + " | فودافون كاش";

  // ---- Numbers ----
  const list = $("numbers");
  SHOP.numbers.forEach(({ number, name }) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="avatar"></div>
      <div class="info">
        <div class="name"></div>
        <div class="phone"></div>
      </div>
      <button class="icon-btn copy" aria-label="نسخ الرقم">${ICONS.copy}</button>
      <button class="pay">حوّل</button>`;
    row.querySelector(".avatar").textContent = name.trim().charAt(0);
    row.querySelector(".name").textContent = name;
    row.querySelector(".phone").textContent = number.replace(/(\d{3})(\d{4})(\d{4})/, "$1 $2 $3");
    const copyBtn = row.querySelector(".copy");
    copyBtn.onclick = () => copy(number, copyBtn);
    row.querySelector(".pay").onclick = () => transfer(number);
    list.appendChild(row);
  });

  // ---- WhatsApp / InstaPay ----
  const extras = $("extras");
  if (SHOP.whatsapp) {
    const wa = document.createElement("a");
    wa.className = "wa";
    wa.target = "_blank";
    wa.rel = "noopener";
    wa.innerHTML = `${ICONS.check}<span>حوّلت؟ ابعت صورة التحويل</span>`;
    wa.href = `https://wa.me/${SHOP.whatsapp}?text=` + encodeURIComponent("تم التحويل فودافون كاش");
    wa.onclick = () => {
      const amount = amountInput.value ? ` بمبلغ ${amountInput.value} جنيه` : "";
      wa.href = `https://wa.me/${SHOP.whatsapp}?text=` + encodeURIComponent(`تم التحويل فودافون كاش${amount}`);
    };
    extras.appendChild(wa);
  }
  if (SHOP.instapay) {
    const ip = document.createElement("a");
    ip.className = "wa insta";
    ip.target = "_blank";
    ip.rel = "noopener";
    ip.href = SHOP.instapay;
    ip.textContent = "ادفع بإنستاباي";
    extras.appendChild(ip);
  }

  // ---- Credit ----
  $("devName").textContent = DEV.name;
  $("devPhone").textContent = DEV.phone;
  $("credit").href = "https://wa.me/2" + DEV.phone;

  // ---- Actions ----
  // يفتح الاتصال بكود تحويل فودافون كاش: *9*7*الرقم*المبلغ#  (# بتتكتب %23)
  // لو المبلغ فاضي، الكود بيتكتب لحد الرقم والزبون يكمّل المبلغ و # بنفسه
  // الآيفون بيمنع أكواد * و # من اللينكات، فبننسخ الرقم بداله
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  function transfer(number) {
    if (isIOS) {
      copy(number, null, "اتنسخ الرقم، حوّل من تطبيق Ana Vodafone");
      return;
    }
    const amount = amountInput.value.trim();
    if (amount && Number(amount) > 0) {
      location.href = `tel:*9*7*${number}*${amount}%23`;
    } else {
      toast("اكتب المبلغ وبعده # ودوس اتصال");
      location.href = `tel:*9*7*${number}*`;
    }
  }

  function copy(text, btn, msg = "تم نسخ الرقم") {
    const done = () => {
      toast(msg);
      if (!btn) return;
      btn.classList.add("done");
      btn.innerHTML = ICONS.check;
      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = ICONS.copy; }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    ta.remove();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }
</script>
</body>
</html>
