<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c40000">
<title>ادفع بفودافون كاش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e60000; --red-dark: #9e0000; --ink: #1a1a1f; --muted: #6b6b76;
    --line: #ececf1; --bg: #f4f4f7; --card: #fff; --green: #1faa59; --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; font-size: 16px;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff; text-align: center;
    padding: 34px 20px 78px;
    background: linear-gradient(150deg, #ff2a2a 0%, var(--red) 40%, var(--red-dark) 100%);
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.08);
  }
  .hero::before { width: 260px; height: 260px; top: -120px; left: -80px; }
  .hero::after { width: 180px; height: 180px; bottom: -70px; right: -50px; }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 22px;
    background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.35);
    display: grid; place-items: center; font-size: 32px; font-weight: 800;
  }
  .hero h1 { margin: 0; font-size: 26px; font-weight: 800; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.3); }

  main { position: relative; max-width: 480px; margin: -54px auto 0; padding: 0 16px 24px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    margin-bottom: 14px; box-shadow: 0 10px 30px -12px rgba(20,20,40,.15);
  }
  .section-title { font-size: 14px; color: var(--muted); font-weight: 700; margin: 22px 4px 10px; }

  /* ---------- Amount ---------- */
  .amount-label { font-weight: 700; font-size: 15px; margin-bottom: 10px; display: block; }
  .amount-box {
    display: flex; align-items: center; border: 2px solid var(--line); border-radius: 16px;
    padding: 4px 16px; transition: border-color .2s, box-shadow .2s;
  }
  .amount-box:focus-within { border-color: var(--red); box-shadow: 0 0 0 4px rgba(230,0,0,.08); }
  .amount-box input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 10px 0;
    font: 800 28px "Cairo", sans-serif; color: var(--ink); text-align: center; direction: ltr;
  }
  .amount-box span { color: var(--muted); font-weight: 700; }
  .chips { display: flex; gap: 8px; margin-top: 12px; }
  .chip {
    flex: 1; padding: 9px 0; border-radius: 12px; border: 1px solid var(--line);
    background: #fafafc; font: 700 15px "Cairo", sans-serif; color: var(--ink); cursor: pointer;
  }
  .chip.active { background: #fff0f0; border-color: var(--red); color: var(--red); }

  /* ---------- Numbers ---------- */
  .num-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .avatar {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
    background: linear-gradient(135deg, #ff4d4d, var(--red-dark));
  }
  .num-info { flex: 1; min-width: 0; }
  .num-name { font-weight: 700; font-size: 17px; }
  .num-phone { direction: ltr; text-align: right; font-size: 20px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink); }
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 14px; padding: 13px 10px; cursor: pointer; text-decoration: none;
    font: 700 15px "Cairo", sans-serif; transition: transform .1s, background .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-light { background: #f2f2f6; color: var(--ink); }
  .btn-light.done { background: #e8f8ef; color: var(--green); }
  .btn-red { background: var(--red); color: #fff; box-shadow: 0 8px 18px -8px rgba(230,0,0,.6); }
  .btn-green { background: var(--green); color: #fff; width: 100%; box-shadow: 0 8px 18px -8px rgba(31,170,89,.6); }
  .btn-purple { background: #4b2a85; color: #fff; width: 100%; margin-top: 10px; }

  .ios-note {
    display: none; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.7;
    background: #fff8e6; border: 1px solid #ffe2a3; border-radius: 16px; padding: 12px 14px; margin-bottom: 14px;
  }

  /* ---------- Steps ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .step b {
    display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 6px; border-radius: 50%;
    background: #fff0f0; color: var(--red); font-weight: 800;
  }
  .step span { font-size: 13px; color: var(--muted); font-weight: 600; }

  /* ---------- Credit ---------- */
  .credit {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 26px; padding: 14px 16px; border-radius: 16px;
    background: #fff; border: 1px dashed #d9d9e3; text-decoration: none; color: var(--ink);
  }
  .credit small { display: block; color: var(--muted); font-size: 12px; }
  .credit strong { font-size: 15px; }
  .credit .wa-pill {
    display: inline-flex; align-items: center; gap: 6px; direction: ltr; white-space: nowrap;
    background: #e8f8ef; color: var(--green); font-weight: 800; font-size: 14px;
    padding: 7px 12px; border-radius: 999px;
  }
  .credit .wa-pill svg { width: 16px; height: 16px; }
  .credit-sub { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 600; font-size: 15px; transition: all .25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="hero">
  <div class="logo" id="logo"></div>
  <h1 id="shopName"></h1>
  <div class="badge"><i></i> الدفع بفودافون كاش متاح</div>
</header>

<main>
  <div class="card">
    <label class="amount-label" for="amount">المبلغ المطلوب</label>
    <div class="amount-box">
      <input id="amount" type="number" inputmode="numeric" min="1" placeholder="0">
      <span>ج.م</span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="ios-note" id="iosNote">
    <span>📱</span>
    <div>على الآيفون: دوس <b>«نسخ»</b> وحوّل من تطبيق Ana Vodafone، أو اطلب <b dir="ltr">*9*7#</b> من الاتصال.</div>
  </div>

  <div class="section-title">اختار الرقم اللي هتحوّل عليه</div>
  <div id="numbers"></div>

  <div class="card">
    <div class="steps">
      <div class="step"><b>١</b><span>اكتب المبلغ</span></div>
      <div class="step"><b>٢</b><span>اختار الرقم وحوّل</span></div>
      <div class="step"><b>٣</b><span>ابعت صورة التحويل</span></div>
    </div>
  </div>

  <div id="extras"></div>

  <a class="credit" id="credit" target="_blank" rel="noopener">
    <div>
      <small>تصميم وتنفيذ</small>
      <strong id="devName"></strong>
    </div>
    <span class="wa-pill">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg>
      <span id="devPhone"></span>
    </span>
  </a>
  <div class="credit-sub">عاوز صفحة زي دي لمحلك؟ كلمني واتساب</div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ============ عدّل البيانات هنا بس ============
  const SHOP = {
    name: "اسم المحل",
    // رقم واتساب لاستقبال صورة التحويل (بصيغة دولية من غير +). سيبه فاضي "" لو مش عاوزه
    whatsapp: "201000000000",
    // لينك إنستاباي (اختياري) سيبه فاضي "" لو مش عاوزه
    instapay: "",
    // مبالغ سريعة بتظهر تحت خانة المبلغ
    quickAmounts: [50, 100, 200, 500],
    numbers: [
      { number: "01000000001", name: "محمد" },
      { number: "01000000002", name: "أحمد" },
      { number: "01000000003", name: "المحل" },
    ],
  };

  // بيانات صاحب الشغل (بتظهر تحت في الصفحة)
  const DEV = {
    name: "م. طه حماده",
    phone: "01061257703",
  };
  // ============================================

  const ICONS = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>',
  };

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const amountInput = document.getElementById("amount");
  const $ = (id) => document.getElementById(id);

  // ---- Header ----
  $("shopName").textContent = SHOP.name;
  $("logo").textContent = SHOP.name.trim().charAt(0);
  document.title = SHOP.name + " | فودافون كاش";
  if (isIOS) $("iosNote").style.display = "flex";

  // ---- Quick amounts ----
  const chips = $("chips");
  SHOP.quickAmounts.forEach((v) => {
    const c = document.createElement("button");
    c.className = "chip";
    c.textContent = v;
    c.onclick = () => { amountInput.value = v; syncChips(); };
    chips.appendChild(c);
  });
  if (!SHOP.quickAmounts.length) chips.remove();
  amountInput.addEventListener("input", syncChips);
  function syncChips() {
    chips.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c.textContent === amountInput.value));
  }

  // ---- Numbers ----
  const list = $("numbers");
  SHOP.numbers.forEach(({ number, name }) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="num-head">
        <div class="avatar"></div>
        <div class="num-info">
          <div class="num-name"></div>
          <div class="num-phone"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-light copy">${ICONS.copy}<span>نسخ</span></button>
        ${isIOS ? "" : `<button class="btn btn-red pay">${ICONS.send}<span>حوّل دلوقتي</span></button>`}
      </div>`;
    card.querySelector(".avatar").textContent = name.trim().charAt(0);
    card.querySelector(".num-name").textContent = name;
    card.querySelector(".num-phone").textContent = number.replace(/(\d{3})(\d{4})(\d{4})/, "$1 $2 $3");
    const copyBtn = card.querySelector(".copy");
    copyBtn.onclick = () => copy(number, copyBtn);
    const pay = card.querySelector(".pay");
    if (pay) pay.onclick = () => transfer(number);
    list.appendChild(card);
  });

  // ---- WhatsApp / InstaPay ----
  const extras = $("extras");
  if (SHOP.whatsapp) {
    const wa = document.createElement("a");
    wa.className = "btn btn-green";
    wa.target = "_blank";
    wa.rel = "noopener";
    wa.href = `https://wa.me/${SHOP.whatsapp}`;
    wa.innerHTML = `${ICONS.check}<span>حوّلت؟ ابعت صورة التحويل واتساب</span>`;
    wa.onclick = () => {
      const amount = amountInput.value ? ` بمبلغ ${amountInput.value} جنيه` : "";
      wa.href = `https://wa.me/${SHOP.whatsapp}?text=` + encodeURIComponent(`تم التحويل فودافون كاش${amount}`);
    };
    extras.appendChild(wa);
  }
  if (SHOP.instapay) {
    const ip = document.createElement("a");
    ip.className = "btn btn-purple";
    ip.target = "_blank";
    ip.rel = "noopener";
    ip.href = SHOP.instapay;
    ip.textContent = "🏦 ادفع بإنستاباي";
    extras.appendChild(ip);
  }

  // ---- Credit ----
  $("devName").textContent = DEV.name;
  $("devPhone").textContent = DEV.phone;
  $("credit").href = "https://wa.me/2" + DEV.phone;

  // ---- Actions ----
  function transfer(number) {
    const amount = amountInput.value.trim();
    if (!amount || Number(amount) <= 0) {
      toast("اكتب المبلغ الأول");
      amountInput.focus();
      return;
    }
    // # لازم تتكتب %23 جوه اللينك
    location.href = `tel:*9*7*${number}*${amount}%23`;
  }

  function copy(text, btn) {
    const done = () => {
      toast("تم نسخ الرقم ✓");
      btn.classList.add("done");
      btn.innerHTML = `${ICONS.check}<span>اتنسخ</span>`;
      setTimeout(() => {
        btn.classList.remove("done");
        btn.innerHTML = `${ICONS.copy}<span>نسخ</span>`;
      }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast(text); }
    ta.remove();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
</script>
</body>
</html>
