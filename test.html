<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة فتح التطبيق</title>
<style>
  body { font-family: "Segoe UI", Tahoma, sans-serif; background: #f5f5f8; margin: 0; padding: 16px; color: #17171c; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: #666; font-size: 13px; margin: 0 0 16px; line-height: 1.7; }
  a {
    display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px;
    padding: 14px; margin-bottom: 10px; text-decoration: none; color: inherit;
  }
  a b { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #e60000; color: #fff; }
  a small { display: block; color: #888; font-size: 11px; direction: ltr; text-align: right; word-break: break-all; }
</style>
</head>
<body>
<h1>تجربة فتح Ana Vodafone</h1>
<p>دوس على كل زرار، وارجع للصفحة دي، واكتب لنفسك رقم الزرار اللي <b>فتح التطبيق على طول</b> من غير ما يوديك Google Play.</p>
<div id="list"></div>

<script>
  const PKG = "com.emeint.android.myservices";
  const STORE = encodeURIComponent("https://play.google.com/store/apps/details?id=" + PKG);
  const TESTS = [
    ["عن طريق Play Store (launch)", `intent://launch?id=${PKG}#Intent;scheme=market;package=com.android.vending;end`],
    ["market://launch مباشر", `market://launch?id=${PKG}`],
    ["فتح الشاشة الرئيسية للتطبيق", `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${PKG};end`],
    ["لينك موقع فودافون (لو التطبيق بيستقبله)", `intent://web.vodafone.com.eg/ar/home#Intent;scheme=https;package=${PKG};S.browser_fallback_url=${STORE};end`],
    ["لينك مخصوص anavodafone://", `intent://home#Intent;scheme=anavodafone;package=${PKG};end`],
    ["لينك مخصوص vodafone://", `intent://home#Intent;scheme=vodafone;package=${PKG};end`],
    ["الطريقة الحالية (للمقارنة)", `intent://#Intent;package=${PKG};S.browser_fallback_url=${STORE};end`],
  ];
  const list = document.getElementById("list");
  TESTS.forEach(([label, href], i) => {
    const a = document.createElement("a");
    a.href = href;
    a.innerHTML = `<b>${i + 1}</b><span>${label}<small></small></span>`;
    a.querySelector("small").textContent = href;
    list.appendChild(a);
  });
</script>
</body>
</html>
